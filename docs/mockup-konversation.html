<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snail — Konversation</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { background:#0f1220; display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .phone { width:390px; height:844px; background:linear-gradient(180deg,#1a1f3a 0%,#0f1220 100%); border-radius:40px; overflow:hidden; position:relative; box-shadow:0 20px 60px rgba(0,0,0,.6); display:flex; flex-direction:column; }
  /* Status bar */
  .statusbar { display:flex; justify-content:space-between; padding:14px 24px 6px; color:#aab; font-size:13px; font-weight:600; }
  /* Header */
  .header { display:flex; align-items:center; justify-content:space-between; padding:8px 20px 16px; }
  .header .title { color:#fff; font-size:20px; font-weight:700; letter-spacing:.5px; }
  .header .title span { color:#7ee0a3; }
  .header .icon { width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; font-size:18px; }
  /* Connection pill */
  .conn { display:flex; align-items:center; gap:8px; background:rgba(126,224,163,.12); border:1px solid rgba(126,224,163,.3); border-radius:20px; padding:6px 14px; margin:0 20px 18px; width:fit-content; }
  .conn .dot { width:8px; height:8px; border-radius:50%; background:#7ee0a3; box-shadow:0 0 8px #7ee0a3; animation:pulse 1.5s infinite; }
  .conn span { color:#7ee0a3; font-size:13px; font-weight:600; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  /* Speakers */
  .speakers { display:flex; gap:12px; padding:0 20px 20px; }
  .speaker { flex:1; background:rgba(255,255,255,.05); border-radius:20px; padding:16px; text-align:center; border:1px solid rgba(255,255,255,.06); }
  .speaker.active { border-color:#7ee0a3; background:rgba(126,224,163,.08); }
  .speaker .avatar { width:52px; height:52px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:24px; }
  .speaker.a .avatar { background:linear-gradient(135deg,#5b8cff,#7ee0a3); }
  .speaker.b .avatar { background:linear-gradient(135deg,#ff8a5b,#ff5b8c); }
  .speaker .name { color:#fff; font-weight:700; font-size:15px; }
  .speaker .lang { color:#889; font-size:12px; margin-top:2px; }
  .speaker .mic { margin-top:10px; font-size:20px; }
  .speaker.active .mic { color:#7ee0a3; }
  /* Live transcript */
  .transcript { flex:1; overflow:hidden; padding:0 20px; display:flex; flex-direction:column; gap:12px; }
  .bubble { max-width:85%; padding:12px 16px; border-radius:18px; font-size:15px; line-height:1.4; }
  .bubble.a { align-self:flex-start; background:rgba(91,140,255,.15); border:1px solid rgba(91,140,255,.25); color:#dbe4ff; border-bottom-left-radius:4px; }
  .bubble.b { align-self:flex-end; background:rgba(255,138,91,.15); border:1px solid rgba(255,138,91,.25); color:#ffe4d6; border-bottom-right-radius:4px; }
  .bubble .meta { font-size:11px; color:#889; margin-bottom:4px; font-weight:600; }
  .bubble .trans { font-size:12px; color:#7ee0a3; margin-top:6px; padding-top:6px; border-top:1px dashed rgba(126,224,163,.2); }
  .bubble .trans::before { content:"🌐 "; }
  /* Bottom bar */
  .bottombar { padding:16px 20px 30px; display:flex; align-items:center; gap:14px; }
  .btn { flex:1; background:linear-gradient(135deg,#7ee0a3,#5b8cff); border:none; color:#0f1220; font-weight:700; font-size:16px; padding:16px; border-radius:16px; cursor:pointer; }
  .btn.mute { flex:0 0 auto; width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); color:#fff; font-size:22px; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="header">
    <div class="title">🐌 <span>Snail</span></div>
    <div class="icon">⚙️</div>
  </div>
  <div class="conn"><div class="dot"></div><span>Verbunden · Session #4821</span></div>
  <div class="speakers">
    <div class="speaker a active">
      <div class="avatar">👤</div>
      <div class="name">Anna</div>
      <div class="lang">Deutsch</div>
      <div class="mic">🎙️</div>
    </div>
    <div class="speaker b">
      <div class="avatar">👤</div>
      <div class="name">Luca</div>
      <div class="lang">English</div>
      <div class="mic">🔇</div>
    </div>
  </div>
  <div class="transcript">
    <div class="bubble a">
      <div class="meta">Anna · DE</div>
      Wo ist der Bahnhof?
      <div class="trans">Where is the train station?</div>
    </div>
    <div class="bubble b">
      <div class="meta">Luca · EN</div>
      Go straight, then turn left.
      <div class="trans">Geh geradeaus, dann links abbiegen.</div>
    </div>
    <div class="bubble a">
      <div class="meta">Anna · DE</div>
      Danke, wie weit ist es?
      <div class="trans">Thanks, how far is it?</div>
    </div>
  </div>
  <div class="bottombar">
    <button class="btn mute">🔇</button>
    <button class="btn">🎤 Sprechen</button>
  </div>
</div>
</body>
</html>
