<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snail — Session erstellen</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { background:#0f1220; display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .phone { width:390px; height:844px; background:linear-gradient(180deg,#1a1f3a 0%,#0f1220 100%); border-radius:40px; overflow:hidden; position:relative; box-shadow:0 20px 60px rgba(0,0,0,.6); display:flex; flex-direction:column; }
  .statusbar { display:flex; justify-content:space-between; padding:14px 24px 6px; color:#aab; font-size:13px; font-weight:600; }
  .header { display:flex; align-items:center; justify-content:space-between; padding:8px 20px 16px; }
  .header .title { color:#fff; font-size:20px; font-weight:700; letter-spacing:.5px; }
  .header .title span { color:#7ee0a3; }
  .header .back { width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; font-size:18px; color:#fff; }
  .content { flex:1; padding:10px 24px; display:flex; flex-direction:column; }
  .step-label { color:#7ee0a3; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  h2 { color:#fff; font-size:24px; font-weight:700; margin-bottom:24px; }
  /* Language selectors */
  .lang-row { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .lang-box { flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:16px; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .lang-box .flag { font-size:28px; }
  .lang-box .label { color:#fff; font-weight:600; font-size:15px; }
  .lang-box .sub { color:#889; font-size:12px; }
  .lang-box .chev { margin-left:auto; color:#889; font-size:18px; }
  .swap { width:40px; height:40px; border-radius:50%; background:rgba(126,224,163,.15); border:1px solid rgba(126,224,163,.3); color:#7ee0a3; display:flex; align-items:center; justify-content:center; font-size:18px; flex:0 0 auto; }
  /* QR code */
  .qr-wrap { display:flex; flex-direction:column; align-items:center; margin:28px 0 8px; }
  .qr { width:200px; height:200px; background:#fff; border-radius:20px; padding:16px; display:flex; align-items:center; justify-content:center; }
  .qr svg { width:100%; height:100%; }
  .qr-label { color:#889; font-size:13px; margin-top:12px; text-align:center; }
  .qr-label b { color:#fff; }
  .code { color:#7ee0a3; font-size:22px; font-weight:800; letter-spacing:4px; margin-top:6px; }
  /* Bottom */
  .bottombar { padding:16px 24px 30px; }
  .btn { width:100%; background:linear-gradient(135deg,#7ee0a3,#5b8cff); border:none; color:#0f1220; font-weight:700; font-size:16px; padding:16px; border-radius:16px; cursor:pointer; }
  .btn.secondary { background:rgba(255,255,255,.08); color:#fff; margin-top:10px; border:1px solid rgba(255,255,255,.12); }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="header">
    <div class="back">←</div>
    <div class="title">🐌 <span>Snail</span></div>
    <div style="width:38px"></div>
  </div>
  <div class="content">
    <div class="step-label">Schritt 1 · Sprachen</div>
    <h2>Neue Session</h2>
    <div class="lang-row">
      <div class="lang-box">
        <div class="flag">🇩🇪</div>
        <div>
          <div class="label">Deutsch</div>
          <div class="sub">Meine Sprache</div>
        </div>
        <div class="chev">▾</div>
      </div>
      <div class="swap">⇄</div>
      <div class="lang-box">
        <div class="flag">🇬🇧</div>
        <div>
          <div class="label">English</div>
          <div class="sub">Gegenüber</div>
        </div>
        <div class="chev">▾</div>
      </div>
    </div>
    <div class="step-label" style="margin-top:20px">Schritt 2 · Einladen</div>
    <div class="qr-wrap">
      <div class="qr">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <rect width="100" height="100" fill="#fff"/>
          <g fill="#0f1220">
            <rect x="5" y="5" width="30" height="30"/><rect x="65" y="5" width="30" height="30"/>
            <rect x="5" y="65" width="30" height="30"/>
            <rect x="12" y="12" width="16" height="16" fill="#fff"/>
            <rect x="72" y="12" width="16" height="16" fill="#fff"/>
            <rect x="12" y="72" width="16" height="16" fill="#fff"/>
            <rect x="45" y="5" width="6" height="6"/><rect x="55" y="5" width="6" height="6"/>
            <rect x="45" y="15" width="6" height="6"/><rect x="55" y="15" width="6" height="6"/>
            <rect x="5" y="45" width="6" height="6"/><rect x="15" y="45" width="6" height="6"/>
            <rect x="25" y="45" width="6" height="6"/><rect x="35" y="45" width="6" height="6"/>
            <rect x="45" y="45" width="6" height="6"/><rect x="55" y="45" width="6" height="6"/>
            <rect x="65" y="45" width="6" height="6"/><rect x="75" y="45" width="6" height="6"/>
            <rect x="85" y="45" width="6" height="6"/>
            <rect x="45" y="55" width="6" height="6"/><rect x="55" y="55" width="6" height="6"/>
            <rect x="65" y="55" width="6" height="6"/><rect x="75" y="55" width="6" height="6"/>
            <rect x="45" y="65" width="6" height="6"/><rect x="55" y="65" width="6" height="6"/>
            <rect x="45" y="75" width="6" height="6"/><rect x="55" y="75" width="6" height="6"/>
            <rect x="65" y="75" width="6" height="6"/><rect x="75" y="75" width="6" height="6"/>
            <rect x="85" y="75" width="6" height="6"/>
            <rect x="45" y="85" width="6" height="6"/><rect x="55" y="85" width="6" height="6"/>
            <rect x="65" y="85" width="6" height="6"/><rect x="75" y="85" width="6" height="6"/>
            <rect x="85" y="85" width="6" height="6"/>
          </g>
        </svg>
      </div>
      <div class="qr-label">Gegenüber scannt diesen Code<br>oder gibt den Code ein:</div>
      <div class="code">4821</div>
    </div>
  </div>
  <div class="bottombar">
    <button class="btn">Session starten</button>
    <button class="btn secondary">Code eingeben</button>
  </div>
</div>
</body>
</html>
