<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snail — Popart Simple</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { background:#f0f0f0; display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .phone { width:390px; height:844px; background:#fff; border-radius:40px; overflow:hidden; position:relative; box-shadow:0 20px 60px rgba(0,0,0,.2); display:flex; flex-direction:column; border:4px solid #000; }
  /* Halftone dots */
  .phone::before { content:''; position:absolute; inset:0; background-image:radial-gradient(rgba(0,0,0,.08) 1.5px, transparent 1.5px); background-size:14px 14px; pointer-events:none; z-index:5; }
  .statusbar { display:flex; justify-content:space-between; padding:14px 24px 6px; color:#000; font-size:13px; font-weight:700; z-index:6; }
  .header { display:flex; align-items:center; justify-content:space-between; padding:8px 20px 16px; z-index:6; }
  .header .title { color:#000; font-size:22px; font-weight:900; letter-spacing:.5px; }
  .header .title span { color:#ff2d55; }
  .header .icon { width:40px; height:40px; border-radius:12px; background:#ffd700; border:3px solid #000; display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow:3px 3px 0 #000; }
  .conn { display:flex; align-items:center; gap:8px; background:#ffd700; border:3px solid #000; border-radius:20px; padding:6px 14px; margin:0 20px 16px; width:fit-content; box-shadow:3px 3px 0 #000; z-index:6; }
  .conn .dot { width:10px; height:10px; border-radius:50%; background:#00c853; box-shadow:0 0 8px #00c853; animation:pulse 1.5s infinite; }
  .conn span { color:#000; font-size:13px; font-weight:800; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .speakers { display:flex; gap:12px; padding:0 20px 16px; z-index:6; }
  .speaker { flex:1; background:#fff; border:3px solid #000; border-radius:20px; padding:14px; text-align:center; box-shadow:4px 4px 0 #000; }
  .speaker.active { background:#00e5ff; }
  .speaker .avatar { width:56px; height:56px; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; font-size:28px; border:3px solid #000; }
  .speaker.a .avatar { background:#ffd700; }
  .speaker.b .avatar { background:#ff8a5b; }
  .speaker .name { color:#000; font-weight:900; font-size:15px; }
  .speaker .lang { color:#000; font-size:12px; font-weight:700; margin-top:2px; }
  .speaker .mic { margin-top:8px; font-size:20px; }
  .speaker.active .mic { color:#000; }
  .transcript { flex:1; overflow:hidden; padding:0 20px; display:flex; flex-direction:column; gap:12px; z-index:6; }
  .bubble { max-width:85%; padding:12px 16px; border-radius:18px; font-size:15px; line-height:1.4; border:3px solid #000; box-shadow:3px 3px 0 #000; }
  .bubble.a { align-self:flex-start; background:#fff; color:#000; border-bottom-left-radius:4px; }
  .bubble.b { align-self:flex-end; background:#ffd700; color:#000; border-bottom-right-radius:4px; }
  .bubble .meta { font-size:11px; color:#555; margin-bottom:4px; font-weight:800; }
  .bubble .trans { font-size:12px; color:#ff2d55; margin-top:6px; padding-top:6px; border-top:2px dashed #000; font-weight:700; }
  .bubble .trans::before { content:"🌐 "; }
  .bottombar { padding:16px 20px 30px; display:flex; align-items:center; gap:14px; z-index:6; }
  .btn { flex:1; background:#ff2d55; border:3px solid #000; color:#fff; font-weight:900; font-size:16px; padding:16px; border-radius:16px; cursor:pointer; box-shadow:4px 4px 0 #000; }
  .btn.mute { flex:0 0 auto; width:56px; height:56px; border-radius:50%; background:#fff; border:3px solid #000; color:#000; font-size:22px; box-shadow:3px 3px 0 #000; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="header">
    <div class="title">🐌 <span>Snail</span></div>
    <div class="icon">⚙️</div>
  </div>
  <div class="conn"><div class="dot"></div><span>Verbunden · Session #4821</span></div>
  <div class="speakers">
    <div class="speaker a active">
      <div class="avatar">👤</div>
      <div class="name">Anna</div>
      <div class="lang">Deutsch</div>
      <div class="mic">🎙️</div>
    </div>
    <div class="speaker b">
      <div class="avatar">👤</div>
      <div class="name">Luca</div>
      <div class="lang">English</div>
      <div class="mic">🔇</div>
    </div>
  </div>
  <div class="transcript">
    <div class="bubble a">
      <div class="meta">Anna · DE</div>
      Wo ist der Bahnhof?
      <div class="trans">Where is the train station?</div>
    </div>
    <div class="bubble b">
      <div class="meta">Luca · EN</div>
      Go straight, then turn left.
      <div class="trans">Geh geradeaus, dann links abbiegen.</div>
    </div>
    <div class="bubble a">
      <div class="meta">Anna · DE</div>
      Danke, wie weit ist es?
      <div class="trans">Thanks, how far is it?</div>
    </div>
  </div>
  <div class="bottombar">
    <button class="btn mute">🔇</button>
    <button class="btn">🎤 Sprechen</button>
  </div>
</div>
</body>
</html>
