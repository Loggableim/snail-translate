name: snail
description: Snail — Echtzeit-Konversationsübersetzer
publish_to: 'none'
version: 0.3.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  uuid: ^4.2.1
  flutter_secure_storage: ^9.2.2
  flutter_webrtc: ^0.12.12
  wakelock_plus: ^1.2.10
  msgpack_dart: ^1.0.1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/snail-logo.png
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.ttf
